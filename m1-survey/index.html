<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M1 需求澄清问卷</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--tx:#14213d;--sub:#5b6478;--ac:#1d4ed8;--ln:#dde2ec;--soft:#eaf0ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--sub:#9aa5ba;--ac:#6b9bff;--ln:#2a3447;--soft:#1c2a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:16px}
.bar{display:flex;gap:6px;margin:4px 0 14px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.bar i.on{background:var(--ac)}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--sub);font-size:14px;margin:0 0 16px}
.q{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.q b{display:block;margin-bottom:8px}.opt{font-size:12px;color:var(--sub);font-weight:400}
textarea{width:100%;min-height:84px;border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical}
.ch{display:flex;flex-wrap:wrap;gap:8px}.ch span{padding:7px 12px;border:1px solid var(--ln);border-radius:20px;font-size:14px;cursor:pointer}
.ch span.on{background:var(--soft);border-color:var(--ac);color:var(--ac)}
.card{display:block;padding:12px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15px}
.card.on{background:var(--soft);border-color:var(--ac)}
.nav{display:flex;gap:10px;margin-top:6px}
button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ac);font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--ac)}button:disabled{opacity:.4}
.hint{color:var(--sub);font-size:13px;margin:8px 0}.err{color:#d33;font-size:13px}
</style></head><body><div class="w" id="app"></div>
<script>
const OPT2=["工作或职业发展需要","考试、升学或证书要求","移民、出国或生活需要","对目前的状态不满意","想发展新的兴趣或能力","之前尝试过，但一直没有进展","最近发生了某件具体的事","暂时说不清原因","其他"];
const ST={A:"我很清楚自己想要什么，只是不知道怎么实现",B:"我有一个大致方向，但还没想清楚具体要达到什么结果",C:"我知道自己对现状不满意，但还不知道真正想要什么",D:"我有好几个想实现的目标，不知道该优先考虑哪个"};
const BR={
A:{t:"你的目标",h:"帮你把目标、期限和判断标准说清楚",q:["你希望具体达到什么结果？","你希望在什么时间内实现？","你会通过什么标准判断自己已经达到目标？","这个目标对你最重要的意义是什么？","你之前为这个目标做过哪些尝试？结果如何？"]},
B:{t:"把方向变具体",h:"把大致的愿望拆成能观察到的变化",q:["你最想改善的是哪一方面？","如果三个月后有了进展，你觉得自己会有哪些具体变化？","这些变化中，哪一个对你最重要？","你之前尝试过哪些相关的事情？哪些有帮助，哪些没有？","你希望先从哪一个具体问题开始？"]},
C:{t:"一起探索方向",h:"不着急下结论，先看看什么对你有意义",q:["目前最让你不满意的是什么？","过去一年，有哪些事情让你觉得有兴趣、投入感或成就感？","有没有什么事情是你一直想尝试，却还没有机会尝试的？","有没有哪些方向是你明确不想走的？为什么？","如果接下来只能先探索一件事，你最想了解什么？"]},
D:{t:"几个目标怎么取舍",h:"我们帮你比较，选择由你来做",q:["你目前想实现的几个目标分别是什么？","每个目标能给你带来什么？","这些目标之间是否存在时间、精力或金钱上的冲突？","如果当前只能重点推进一个目标，你倾向于选哪个？为什么？","有没有哪些目标可以暂时放一放，而不是彻底放弃？"]}};
const S={step:1,a:{q2:[],r3:[]},sum:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar=()=>`<div class="bar">${[1,2,3,4].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join("")}</div>`;
function ta(key,label,opt){return `<div class="q"><b>${label}${opt?' <span class="opt">可跳过</span>':''}</b><textarea oninput="S.a['${key}']=this.value">${esc(S.a[key])}</textarea></div>`}
function chips(key,list,multi,label){return `<div class="q"><b>${label} <span class="opt">${multi?'可多选，':''}可跳过</span></b><div class="ch">${list.map(x=>{const on=multi?(S.a[key]||[]).includes(x):S.a[key]===x;return `<span class="${on?'on':''}" onclick="pick('${key}','${x}',${multi},this)">${x}</span>`}).join("")}</div></div>`}
function pick(k,v,multi,el){if(multi){const a=S.a[k]=S.a[k]||[];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);el.classList.toggle("on")}else{S.a[k]=S.a[k]===v?"":v;[...el.parentNode.children].forEach(c=>c.classList.toggle("on",c.textContent===S.a[k]))}}
function nav(back,next,label,dis){return `<div class="nav">${back?`<button class="g" onclick="go(${S.step-1})">上一步</button>`:''}<button id="nx" ${dis?'disabled':''} onclick="${next}">${label||'下一步'}</button></div>`}
function go(n){S.step=n;if(n==4)S.sum=null;render();scrollTo(0,0)}
function ok1(){$("nx").disabled=!((S.a.q1||"").trim()&&S.a.state)}
function render(){const a=S.a,el=$("app");
if(S.step==1){el.innerHTML=bar()+`<h1>说说你目前的需求</h1><p class="sub">约 2–3 分钟，用自己的话说就好，不需要选标准答案。</p>
<div class="q"><b>1. 你现在最想解决什么问题？</b><textarea oninput="S.a.q1=this.value;ok1()">${esc(a.q1)}</textarea></div>`+
chips("q2",OPT2,true,"2. 为什么最近开始考虑解决这个问题？")+ta("q2x","如果有具体的事情促使你开始考虑，可以补充",1)+ta("q3","3. 如果这个问题得到改善，你希望自己的生活或状态发生什么变化？",1)+
`<div class="q"><b>4. 你目前对自己想要的结果，处于什么状态？</b>${Object.keys(ST).map(k=>`<label class="card ${a.state==k?'on':''}" onclick="a=S.a;a.state='${k}';render1()">${ST[k]}</label>`).join("")}</div>`+nav(0,"go(2)","下一步",!((a.q1||"").trim()&&a.state));}
else if(S.step==2){const b=BR[a.state];el.innerHTML=bar()+`<h1>${b.t}</h1><p class="sub">${b.h}。不想答的可以直接跳过。</p>`+b.q.map((q,i)=>ta("b"+i,(i+1)+". "+q,1)).join("")+nav(1,"go(3)");}
else if(S.step==3){el.innerHTML=bar()+`<h1>了解你的现实情况</h1><p class="sub">只是为了让目标和你的实际条件对得上，每题都可以跳过。</p>`+
chips("r1",["一个月内","三个月内","半年内","目前没有明确期限"],0,"1. 你希望什么时候看到初步变化？")+chips("r2",["1–3 小时","4–7 小时","8–14 小时","15 小时以上","不确定"],0,"2. 你每周大约能投入多少时间？")+
chips("r3",["工作时间","经济预算","家庭责任","精力","现有知识基础","其他安排"],1,"3. 目前有哪些现实条件可能影响目标？")+ta("r4","4. 为了实现目标，你愿意投入或调整什么？（时间、金钱、固定练习、接受反馈等）",1)+ta("r5","5. 有没有什么是你暂时不愿改变，或不希望服务过程中触及的？",1)+nav(1,"go(4)","生成我的需求摘要");}
else if(S.step==4){el.innerHTML=bar()+`<h1>确认你的需求摘要</h1><p class="sub">这是根据你的回答整理的，请看看准不准，可以直接修改。</p><div id="sb"></div>`;S.sum?showSum():gen();}
else{el.innerHTML=`<div class="q" style="margin-top:40px;text-align:center"><h1>已提交 ✓</h1><p class="sub">你的需求摘要已提交，导师复核后会与你确认下一步。</p></div><button class="g" onclick="location.reload()">重新体验</button>`}}
function render1(){const y=window.scrollY;render();scrollTo(0,y)}
const FL=[["problem","我目前最希望解决的问题"],["goal","我希望实现的阶段目标"],["meaning","这个目标对我的意义"],["timeframe","期望的时间范围"],["conditions","目前需要考虑的现实条件"],["open","仍然需要进一步明确的地方"]];
function tmpl(){const a=S.a,b=BR[a.state].q,g=a.state=="C"?"（方向尚不明确）需要探索："+(a.b4||a.b0||"未提供"):(a.b1&&a.state=="A"?a.b0:(a.b0||"未提供"));
return{problem:a.q1||"未提供",goal:g,meaning:a.state=="A"?(a.b3||"未提供"):(a.q3||"未提供"),timeframe:(a.state=="A"&&a.b1)||a.r1||"未提供",conditions:[a.r2&&"每周约 "+a.r2,(a.r3||[]).join("、"),a.r5&&"暂不希望触及："+a.r5].filter(Boolean).join("；")||"未提供",open:"请你补充还不确定的部分。",internal:{}}}
async function gen(){$("sb").innerHTML='<p class="hint">正在整理你的回答…</p>';
const pay={状态:ST[S.a.state],第一页:{问题:S.a.q1,原因:S.a.q2,原因补充:S.a.q2x,期望变化:S.a.q3},分支问答:BR[S.a.state].q.map((q,i)=>({问:q,答:S.a["b"+i]||""})),现实条件:{期限:S.a.r1,每周时间:S.a.r2,限制:S.a.r3,愿意投入:S.a.r4,不愿触及:S.a.r5}};
try{const c=new AbortController();setTimeout(()=>c.abort(),20000);
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},signal:c.signal,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:"你是学习服务的需求整理助手。根据用户问卷回答，用第一人称“我”整理需求摘要。规则：只归纳用户已说过的内容，不添加用户没说的目标、动机或结论；没回答的写“未提供”并列入open；不贴标签，不诊断能力、性格或执行力；语气中性尊重；方向不清时goal写“当前需要探索的问题：…”，不强行拟定目标。只输出JSON，不要任何其他文字或代码块标记。格式：{\"problem\":\"\",\"goal\":\"\",\"meaning\":\"\",\"timeframe\":\"\",\"conditions\":\"\",\"open\":\"\",\"internal\":{\"type_basis\":\"用户自选状态与回答是否一致\",\"to_verify\":\"\",\"next_step\":\"进入能力诊断/进一步澄清目标/探索方向/先做小任务验证 之一\"}}",messages:[{role:"user",content:JSON.stringify(pay)}]})});
const d=await r.json();const t=d.content.filter(x=>x.type=="text").map(x=>x.text).join("").replace(/```json|```/g,"").trim();S.sum=JSON.parse(t);S.ai=true}
catch(e){S.sum=tmpl();S.ai=false}
if(S.step==4)showSum()}
function showSum(){const s=S.sum;$("sb").innerHTML=(S.ai?'':'<p class="err">自动整理暂时不可用，下面是按你的原话拼的草稿，请直接修改。</p>')+FL.map(([k,l])=>`<div class="q"><b>${l}</b><textarea oninput="S.sum['${k}']=this.value">${esc(s[k])}</textarea></div>`).join("")+`<div class="nav"><button class="g" onclick="go(3)">修改我的回答</button><button onclick="S.step=5;render()">确认并提交</button></div>`}
render();
</script></body></html>
