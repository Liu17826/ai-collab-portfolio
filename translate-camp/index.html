<title>中译英翻译训练营</title>
<style>
  :root{
    --paper:#F7F2E7;
    --paper-line:#E8DEC8;
    --ink:#2B2A28;
    --ink-soft:#6b6558;
    --card:#FFFDF8;
    --purple:#8B5CF6;
    --pink:#EC6BA5;
    --blue:#3E8CFF;
    --green:#2FAE83;
    --red:#F0603D;
    --teal:#1FA6A0;
    --violet:#6D4CFF;
    --orange:#F59E0B;
    --gray:#9A948A;
    --shadow: 0 2px 10px rgba(43,42,40,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased;}
  body{ padding-bottom: 40px; }
  h1,h2,h3{ font-family: "Songti SC", "Noto Serif SC", Georgia, serif; margin:0; font-weight:700; }
  .mono{ font-family: "SF Mono", Menlo, monospace; }

  /* ---------- top bar ---------- */
  .topbar{ position:sticky; top:0; z-index:20; background:var(--paper); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--paper-line); }
  .topbar .brand{ display:flex; align-items:center; gap:8px; }
  .topbar .brand h1{ font-size:19px; letter-spacing:0.5px; }
  .topbar .dot{ width:8px; height:8px; border-radius:50%; background:var(--violet); }
  .iconbtn{ border:none; background:var(--card); box-shadow:var(--shadow); border-radius:12px; padding:8px 12px; font-size:13px; color:var(--ink); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .iconbtn:active{ transform: scale(0.97); }
  .badge{ background:var(--red); color:#fff; border-radius:10px; font-size:11px; padding:1px 6px; min-width:16px; text-align:center; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .key-dot{ width:6px; height:6px; border-radius:50%; background:var(--gray); }
  .key-dot.on{ background:var(--green); }

  /* ---------- home ---------- */
  .section-label{ font-size:12px; color:var(--ink-soft); letter-spacing:1px; margin:22px 16px 10px; text-transform:uppercase; }
  .hero{ margin:16px; padding:18px; border-radius:18px; background:linear-gradient(135deg, #EFE6FF, #F7F2E7); }
  .hero h2{ font-size:18px; }
  .hero .note{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.6; }

  .stats-row{ display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; margin:14px 16px 0; }
  .stat-chip{ background:var(--card); border-radius:12px; padding:10px 8px; box-shadow:var(--shadow); text-align:center; }
  .stat-chip .lbl{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; }
  .stat-chip .val{ font-size:18px; font-weight:700; margin-top:2px; }

  .cardgrid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:0 16px; }
  .topic-card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); cursor:pointer; border:1px solid rgba(0,0,0,0.03); min-height:120px; display:flex; flex-direction:column; justify-content:space-between; }
  .topic-card:active{ transform: scale(0.98); }
  .topic-card .icon{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; font-weight:700; margin-bottom:8px; }
  .topic-card .ttl{ font-size:15px; font-weight:700; }
  .topic-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- sentence list ---------- */
  .backrow{ display:flex; align-items:center; gap:10px; padding:10px 16px 0; }
  .backbtn{ border:none; background:none; font-size:15px; color:var(--ink-soft); padding:4px 0; cursor:pointer; }
  .screen-title{ display:flex; align-items:center; gap:10px; padding:6px 16px 4px; }
  .screen-title h2{ font-size:19px; }
  .screen-title .count{ font-size:12px; color:var(--ink-soft); margin-left:auto; }

  .toolbar{ display:flex; gap:6px; padding:10px 16px; overflow-x:auto; }
  .tbtn{ flex:none; border:none; background:var(--card); padding:7px 12px; border-radius:999px; font-size:12.5px; color:var(--ink-soft); box-shadow:var(--shadow); cursor:pointer; white-space:nowrap; }
  .tbtn.active{ background:var(--ink); color:#fff; }

  .sent-list-item{ background:var(--card); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin:0 16px 10px; cursor:pointer; }
  .sent-list-item:active{ transform: scale(0.99); }
  .sent-list-item .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .sent-list-item .num{ font-size:11px; font-weight:700; color:var(--violet); padding:2px 8px; border-radius:999px; background:rgba(109,76,255,0.10); }
  .sent-list-item .status{ font-size:11px; }
  .sent-list-item.done .status{ color:var(--green); }
  .sent-list-item.partial .status{ color:var(--orange); }
  .sent-list-item .cn{ font-size:14px; line-height:1.6; color:var(--ink); }

  /* ---------- practice screen ---------- */
  .prompt-card{ background:var(--card); border-radius:14px; padding:18px 16px; box-shadow:var(--shadow); margin:0 16px 14px; border-left:4px solid var(--violet); }
  .prompt-card .label{ font-size:11px; color:var(--violet); font-weight:700; letter-spacing:0.5px; margin-bottom:6px; }
  .prompt-card .cn{ font-size:17px; font-weight:600; line-height:1.6; }
  .prompt-card .hint{ font-size:12px; color:var(--ink-soft); margin-top:10px; padding-top:10px; border-top:1px dashed var(--paper-line); }

  .steps{ background:#FBF7EA; border-radius:12px; padding:12px 14px; margin:0 16px 14px; font-size:12.5px; line-height:1.7; color:var(--ink-soft); }
  .steps b{ color:var(--violet); }

  textarea{ width:100%; border:1.5px solid var(--paper-line); border-radius:12px; padding:12px; font-size:15px; font-family:inherit; resize:vertical; min-height:120px; background:var(--card); color:var(--ink); line-height:1.7; }
  textarea:focus{ outline:2px solid var(--violet); border-color:transparent; }

  .status-bar{ margin:0 16px 12px; padding:10px 14px; background:var(--card); border-radius:12px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; }
  .status-bar .wc{ font-size:13px; color:var(--ink-soft); }
  .status-bar .wc b{ color:var(--ink); font-size:15px; }

  .row-btns{ display:flex; gap:10px; margin:0 16px 14px; flex-wrap:wrap; }
  .btn{ border:none; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  .btn-violet{ background:var(--violet); color:#fff; }
  .btn:disabled{ opacity:0.4; }

  .feedback-box{ margin:0 16px 14px; padding:14px; border-radius:12px; }
  .feedback-box.good{ background:rgba(47,174,131,0.12); border:1px solid rgba(47,174,131,0.35); }
  .feedback-box.warn{ background:rgba(240,96,61,0.10); border:1px solid rgba(240,96,61,0.3); }
  .feedback-box.info{ background:rgba(62,140,255,0.10); border:1px solid rgba(62,140,255,0.3); }
  .feedback-title{ font-weight:700; font-size:14px; margin-bottom:8px; }
  .feedback-line{ font-size:13.5px; line-height:1.75; margin:6px 0; }
  .section-divider{ font-size:12px; color:var(--ink-soft); margin:12px 0 6px; text-transform:uppercase; letter-spacing:0.5px; }
  .chip-pill{ display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:999px; font-size:11.5px; margin:3px 4px 3px 0; color:#fff; }
  .spinner{ width:14px; height:14px; border:2px solid rgba(0,0,0,0.15); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .grade-row{ display:flex; gap:10px; margin:10px 0; padding:10px; background:#fff; border-radius:8px; }
  .grade-row .dim{ flex:none; width:80px; font-size:12px; color:var(--ink-soft); }
  .grade-row .bar{ flex:1; height:8px; background:var(--paper-line); border-radius:4px; overflow:hidden; }
  .grade-row .bar > div{ height:100%; background:linear-gradient(90deg, var(--violet), var(--pink)); }
  .grade-row .v{ flex:none; width:36px; text-align:right; font-weight:700; font-size:13px; }

  .correction-row{ margin:10px 0; padding:10px; background:#fff; border-radius:8px; border-left:3px solid var(--red); }
  .correction-row .original{ font-size:13.5px; color:var(--red); text-decoration:line-through; }
  .correction-row .fixed{ font-size:13.5px; color:var(--green); font-weight:600; margin-top:4px; }
  .correction-row .expl{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .correction-row .tag{ display:inline-block; background:var(--violet); color:#fff; padding:1px 6px; border-radius:8px; font-size:10px; margin-left:4px; }

  .vocab-chip{ display:inline-block; padding:3px 8px; background:var(--card); border:1px solid var(--paper-line); border-radius:8px; font-size:12px; margin:3px 4px 3px 0; }
  .vocab-chip b{ color:var(--violet); }

  /* ---------- modal ---------- */
  .modal-mask{ position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn 0.2s; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{ background:var(--paper); width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:20px 18px 28px; max-height:90vh; overflow-y:auto; position:relative; }
  .modal h3{ font-size:18px; margin-bottom:6px; }
  .modal .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; line-height:1.6; }
  .modal label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  .modal .status{ margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13px; line-height:1.6; }
  .modal .status.ok{ background:rgba(47,174,131,0.12); border:1px solid rgba(47,174,131,0.35); }
  .modal .status.err{ background:rgba(240,96,61,0.10); border:1px solid rgba(240,96,61,0.3); }
  .modal .status.idle{ background:#F1ECDD; border:1px dashed var(--paper-line); color:var(--ink-soft); }
  .modal .close-x{ position:absolute; right:16px; top:14px; font-size:22px; background:none; border:none; color:var(--ink-soft); cursor:pointer; }
  .modal .provider-pick{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .modal .pchip{ padding:6px 12px; border-radius:999px; border:1.5px solid var(--paper-line); background:var(--card); font-size:13px; cursor:pointer; }
  .modal .pchip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=password]{ width:100%; border:1.5px solid var(--paper-line); border-radius:12px; padding:12px; font-size:14px; background:var(--card); color:var(--ink); }
  input[type=password]:focus{ outline:2px solid var(--violet); border-color:transparent; }
  input[type=text]{ width:100%; border:1.5px solid var(--paper-line); border-radius:12px; padding:12px; font-size:16px; font-family:inherit; background:var(--card); color:var(--ink); }
  input[type=text]:focus{ outline:2px solid var(--violet); border-color:transparent; }
  .close-x{ position:absolute; top:10px; right:14px; width:32px; height:32px; border:none; background:transparent; font-size:24px; line-height:1; color:var(--ink-soft); cursor:pointer; border-radius:50%; }
  .close-x:active{ background:var(--paper-line); }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; }
  .small-link{ font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; }

  .pill-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{ padding:3px 8px; border-radius:999px; font-size:11px; background:var(--card); color:var(--ink-soft); box-shadow:var(--shadow); }
</style>
</head>

let AI_CFG = { provider:'deepseek', key:'' };
function loadAICfg(){ AI_CFG = storageGet('ai-cfg', { provider:'deepseek', key:'' }); }
function saveAICfg(){ storageSet('ai-cfg', AI_CFG); }
function aiReady(){ return !!(AI_CFG.key && AI_CFG.key.trim()); }

/* ============================= NETWORK HELPERS ============================= */
function fetchWithTimeout(url, options, timeoutMs=25000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  return fetch(url, Object.assign({}, options, { signal: controller.signal }))
    .finally(()=>clearTimeout(timer));
}

async function callAI(promptText){
  if(!aiReady()) throw new Error('NO_KEY');
  const p = PROVIDERS[AI_CFG.provider];
  let resp;
  try{
    resp = await fetchWithTimeout(p.url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_CFG.key.trim() },
      body: JSON.stringify({
        model: p.model,
        max_tokens: 1800,
        temperature: 0.3,
        messages: [
          { role:'system', content:'你只输出严格的 JSON 对象，不输出任何其他文字、说明或 markdown 代码块符号。' },
          { role:'user', content: promptText }
        ]
      })
    });
  }catch(err){
    if(err.name === 'AbortError') throw new Error('请求超时，请检查网络后重试');
    throw err;
  }
  if(!resp.ok){
    const txt = await resp.text().catch(()=> '');
    throw new Error('HTTP '+resp.status+' · '+txt.slice(0,200));
  }
  const data = await resp.json();
  const text = (data.choices?.[0]?.message?.content || '').trim();
  if(!text) throw new Error('EMPTY_RESPONSE');
  return parseJsonSafe(text);
}

function parseJsonSafe(text){
  let raw = text.replace(/^```json\s*/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  // 尝试直接解析
  try{ return JSON.parse(raw); }catch(e){}
  // 提取第一个 { 到最后一个 } 的内容
  const firstBrace = raw.indexOf('{');
  const lastBrace = raw.lastIndexOf('}');
  if(firstBrace>=0 && lastBrace>firstBrace){
    const slice = raw.slice(firstBrace, lastBrace+1);
    try{ return JSON.parse(slice); }catch(e){}
  }
  throw new Error('JSON_PARSE_FAIL: '+raw.slice(0,150));
}

async function callAIText(promptText){
  if(!aiReady()) throw new Error('NO_KEY');
  const p = PROVIDERS[AI_CFG.provider];
  let resp;
  try{
    resp = await fetchWithTimeout(p.url, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+AI_CFG.key.trim() },
      body: JSON.stringify({
        model: p.model,
        max_tokens: 500,
        temperature: 0.3,
        messages: [{ role:'user', content: promptText }]
      })
    });
  }catch(err){
    if(err.name === 'AbortError') throw new Error('请求超时，请检查网络后重试');
    throw err;
  }
  if(!resp.ok){
    const txt = await resp.text().catch(()=> '');
    throw new Error('HTTP '+resp.status+' · '+txt.slice(0,200));
  }
  const data = await resp.json();
  const text = (data.choices?.[0]?.message?.content || '').trim();
  if(!text) throw new Error('EMPTY_RESPONSE');
  return text;
}

function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function openSentence(id){
  // self-heal: if this sentence's "grading" flag has been stuck for way too
  // long (over 40s, well past our fetch timeout), it's dead — clear it
  // automatically instead of trusting it forever and leaving the sentence
  // stuck in a permanent "grading..." state.
  const pending = PENDING_REQUESTS[id];
  if(pending && Date.now() - (pending.ts||0) > 40000){
    delete PENDING_REQUESTS[id];
  }
  CURRENT_SENTENCE = SENTENCES.find(s=>s.id===id);
  LAST_VISIT.sentenceId = id;
  storageSet('translation-last', LAST_VISIT);
  // 加载用户自己填入的中文句子（替代原始教材内容）
  const savedCn = storageGet('sentence-cn-'+id, '');
  if (savedCn) CURRENT_SENTENCE.cn = savedCn;
  // load previous translation if exists
  const prev = storageGet('translation-draft-'+id, '');
  CURRENT_TRANSLATION = prev;
  // if this sentence has a grading request still in flight, honestly show that instead of resetting
  GRADING = !!PENDING_REQUESTS[id];
  LAST_RESULT = PROGRESS[id]?.result || null;
  VIEW = 'practice';
  render();
}

  const s = SENTENCES.find(x=>x.id===id);
  if (s) s.cn = value;
}

/* ============================= AI GRADING ============================= */
async function gradeTranslation(){
  if(!CURRENT_TRANSLATION || CURRENT_TRANSLATION.trim().length < 5){
    alert('请先写一些翻译内容再提交批改。');
    return;
  }
  if(!aiReady()){
    openAISettings();
    return;
  }

  // capture everything by value up front so that if the user navigates away
  // mid-request, this request keeps working with the ORIGINAL sentence/text,
  // and never mis-attributes results to whatever sentence happens to be open later.
  const sentenceId = CURRENT_SENTENCE.id;
  const sentenceCn = CURRENT_SENTENCE.cn;
  const userText = CURRENT_TRANSLATION;
  const myToken = ++REQUEST_SEQ;
  PENDING_REQUESTS[sentenceId] = { token: myToken, ts: Date.now() };

  GRADING = true; render();

  // helper: is this specific request still the "live" one for its sentence?
  const isLiveRequest = () => {
    const p = PENDING_REQUESTS[sentenceId];
    return !!p && p.token === myToken;
  };

  try{
    // step 1: generate TWO reference translations: 7.5 (based on student level) + 9 (reference style)
    const refPrompt = `请把下面这句中文翻译成两个水平的英文：

中文：${sentenceCn}

要求：
1. 先给一个 7.5 分水平的译文：保留简单句结构，只在词汇和搭配上略作提升，不要太复杂。适合目标是 7-7.5 分的学生学习。
2. 然后另起一行写 ---9 分---
3. 再给一个9 分范文：句式多样、词汇高级、复杂结构。

只输出这两段英文，中间用 ---9 分--- 分隔，不要任何其他解释、不要引号、不要 markdown。`;
    const refFull = await callAIText(refPrompt);
    // parse the two parts
    let ref75 = '', ref9 = '';
    const parts = refFull.split(/---9\s*分---/i);
    ref75 = (parts[0] || '').trim();
    ref9 = (parts[1] || '').trim();
    // fallback if split failed
    if(!ref75 && ref9){ ref75 = ref9; ref9 = ''; }
    if(!ref75 && !ref9){ ref75 = refFull.trim(); }
    // for grade prompt compatibility
    const ref = ref75;
    // step 2: grade
    const result = await callAI(GRADE_PROMPT(sentenceCn, userText, ref));

    // if a newer request for this same sentence has since superseded this one
    // (or it was cancelled/reset), drop this stale result entirely
    if(!isLiveRequest()){
      return;
    }
    delete PENDING_REQUESTS[sentenceId];

    if(ref75 && !result.ref_75) result.ref_75 = ref75;
    if(ref9 && !result.ref_9) result.ref_9 = ref9;

    // always persist the result against the sentence it actually belongs to,
    // regardless of whether the user is still viewing it
    PROGRESS[sentenceId] = {
      done: result.is_correct,
      score: result.overall,
      ts: Date.now(),
      partial: !result.is_correct && userText.trim().length > 5,
      result: result
    };
    storageSet('translation-progress', PROGRESS);
    storageSet('translation-draft-'+sentenceId, userText);

    // only touch the live UI (spinner / re-render) if the user is still on this sentence
    if(CURRENT_SENTENCE && CURRENT_SENTENCE.id === sentenceId){
      LAST_RESULT = result;
      GRADING = false;
      render();
    }
  }catch(e){
    // superseded/cancelled -> ignore this stale error silently
    if(!isLiveRequest()){
      return;
    }
    delete PENDING_REQUESTS[sentenceId];

    // only show a blocking alert if the user is still actually looking at this sentence;
    // otherwise a stray alert() would freeze the UI while they're doing something else
    if(CURRENT_SENTENCE && CURRENT_SENTENCE.id === sentenceId){
      GRADING = false;
      let msg = '批改失败：'+(e.message||e);
      if(e.message==='NO_KEY') msg='还没配置 AI Key。';
      if(e.message && e.message.startsWith('JSON_PARSE_FAIL')){
        msg = 'AI 返回格式异常，请重试一次（网络/服务偶发问题）。';
      }
      alert(msg);
      render();
    }
  }
}

  }

  // ✅ 逐词拆解（核心方法）
  if(r.word_by_word && r.word_by_word.length){

      <div class="section-divider" style="margin-top:0; color:var(--violet);">🔍 逐词拆解</div>`;
    r.word_by_word.forEach(w=>{
      let icon='✓', color='var(--green)';
      if(w.status==='bad'){ icon='❌'; color='var(--red)'; }

      html += `<div style="margin:6px 0; padding:8px 10px; background:#fff; border-radius:8px; border-left:3px solid ${color};">
        <div style="font-size:13.5px;"><span style="color:${color}; margin-right:6px;">${icon}</span>${escapeHtml(w.phrase||'')}</div>
        <div style="font-size:12.5px; color:var(--ink-soft); margin-top:3px; padding-left:22px;">${escapeHtml(w.comment||'')}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // 关键修改点（1 个最主要的）
  if(r.key_fix && r.key_fix.original){

      <div class="feedback-title">🎯 关键修改点（7.5 调整）</div>
      <div class="correction-row">
        <div><span class="original">${escapeHtml(r.key_fix.original||'')}</span></div>

      </div>
    </div>`;
  }

  // 错误类型归类 - 告诉你这类错误怎么记
  if(r.error_pattern){
    html += `<div style="margin:0 16px 14px; padding:14px; background:#FBF7EA; border-radius:14px; box-shadow:var(--shadow); border:1px dashed var(--paper-line);">

      html += `<div style="font-size:13px; line-height:1.8; margin-bottom:8px;">常见例子：${escapeHtml(r.error_pattern.description)}</div>`;
    }
    if(r.error_pattern.how_to_remember){
      html += `<div style="background:rgba(109,76,255,0.10); padding:10px 12px; border-radius:8px; font-size:13px; line-height:1.7;"><b style="color:var(--violet);">💡 怎么记：</b>${escapeHtml(r.error_pattern.how_to_remember)}</div>`;
    }
    html += `</div>`;
  }

  // 进步建议（从当前分数到 7.5）
  const currentScore = r.overall || 7;
  if(currentScore < 7.5){
    html += `<div class="feedback-box good">
      <div class="feedback-title">📈 怎么从 ${currentScore} 提到 7.5</div>
      <div class="feedback-line">${escapeHtml(r.how_to_next || '重点掌握名词 + 介词的固定搭配，如 impact on / rise in / access to / threat to / awareness of。这些搭配要作为整体记。')}</div>
    </div>`;
  }

  // 整体评语
  if(r.comment){
    html += `<div class="feedback-box good">
      <div class="feedback-title">📋 老师评语</div>
      <div class="feedback-line">${escapeHtml(r.comment)}</div>
    </div>`;
  }

  return html;
}

let WORD_BOOK = []; // [{id, phrase, type, source, ts, meaning, sourceRefs}]
let WORD_INDEX = {}; // phrase_lower -> wordbook entry id

function loadWordBook(){
  WORD_BOOK = storageGet('wordbook-entries', []);
  WORD_INDEX = storageGet('wordbook-index', {});
}
function saveWordBook(){
  storageSet('wordbook-entries', WORD_BOOK);
  storageSet('wordbook-index', WORD_INDEX);
}

function normalizePhrase(p){
  return (p||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?'"]/g,'');
}

function addWordBookEntry(phrase, opts){
  phrase = (phrase||'').trim();
  if(!phrase) return null;
  const key = normalizePhrase(phrase);
  if(WORD_INDEX[key]) return WORD_BOOK.find(w=>w.id === WORD_INDEX[key]);
  const id = 'wb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const entry = {
    id,
    phrase,
    type: opts?.type || 'word',
    source: opts?.source || 'manual',
    ts: opts?.ts || Date.now(),
    meaning: opts?.meaning || '',
    sourceRefs: opts?.sourceRefs || [],
    note: opts?.note || ''
  };
  WORD_BOOK.push(entry);
  WORD_INDEX[key] = id;
  return entry;
}

function attachSourceToEntry(entry, ref){
  if(!entry || !ref) return;
  if(entry.sourceRefs.some(r=>r.type===ref.type && r.id===ref.id && r.snippet===ref.snippet)) return;
  entry.sourceRefs.push(ref);
}

function filterWordbook(f){
  WB_FILTER = f;

function renderWordbookList(filter){
  if(!WORD_BOOK || WORD_BOOK.length === 0){
    return `<div class="empty" style="padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.8;">
      词库还是空的。<br>点「📥 导入」把你的备忘录词条粘进来。
    </div>`;
  }
  const filtered = filter ? WORD_BOOK.filter(w=>w.type===filter) : WORD_BOOK;
  const groups = {};
  filtered.forEach(w=>{
    const d = new Date(w.ts);
    const dateKey = `${d.getFullYear()}年${(d.getMonth()+1).toString().padStart(2,'0')}月${d.getDate().toString().padStart(2,'0')}日`;
    if(!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(w);
  });
  const dates = Object.keys(groups).sort((a,b)=>{
    const ka = groups[a][0].ts;
    const kb = groups[b][0].ts;
    return kb - ka;
  });
  let html = '<div style="display:flex; gap:6px; margin-bottom:12px; font-size:12px; flex-wrap:wrap;">';
  html += `<span class="chip ${!filter?'on':''}" onclick="filterWordbook(null)" style="cursor:pointer; padding:4px 10px; border-radius:14px; background:${!filter?'var(--violet)':'var(--card)'}; color:${!filter?'#fff':'var(--ink)'};">全部 (${WORD_BOOK.length})</span>`;
  html += `<span class="chip ${filter==='phrase'?'on':''}" onclick="filterWordbook('phrase')" style="cursor:pointer; padding:4px 10px; border-radius:14px; background:${filter==='phrase'?'var(--violet)':'var(--card)'}; color:${filter==='phrase'?'#fff':'var(--ink)'};">词伙 (${WORD_BOOK.filter(w=>w.type==='phrase').length})</span>`;
  html += `<span class="chip ${filter==='word'?'on':''}" onclick="filterWordbook('word')" style="cursor:pointer; padding:4px 10px; border-radius:14px; background:${filter==='word'?'var(--violet)':'var(--card)'}; color:${filter==='word'?'#fff':'var(--ink)'};">单词 (${WORD_BOOK.filter(w=>w.type==='word').length})</span>`;
  html += '</div>';
  dates.forEach(date=>{
    html += `<div style="font-size:12px; color:var(--ink-soft); margin:14px 4px 6px;">${date}</div>`;
    groups[date].forEach(w=>{
      html += renderWordbookRow(w);
    });
  });
  return html;
}

function renderWordbookRow(w){
  const safePhrase = escapeHtml(w.phrase).replace(/'/g,"\\'");
  const dict = w._dict;
  let inner = '';
  if(dict){
    // 完整展开：音标 + 多义项 + 例句
    const ph = [dict.phonetic_uk && `英 ${escapeHtml(dict.phonetic_uk)}`, dict.phonetic_us && `美 ${escapeHtml(dict.phonetic_us)}`].filter(Boolean).join(' · ');
    if(ph) inner += `<div style="font-size:12.5px; color:var(--ink-soft); margin:6px 0 8px;">${ph}</div>`;
    if(dict.meanings && dict.meanings.length){
      dict.meanings.forEach(m=>{
        inner += `<div style="margin:6px 0; padding:8px 10px; background:#F1EFEB; border-radius:8px;">
          <div style="font-size:13px;"><span style="background:var(--violet); color:#fff; padding:1px 6px; border-radius:4px; font-size:10px; margin-right:6px;">${escapeHtml(m.pos||'')}</span><b>${escapeHtml(m.meaning_cn||'')}</b></div>
          ${m.meaning_en?`<div style="font-size:11.5px; color:var(--ink-soft); margin-top:3px;">${escapeHtml(m.meaning_en)}</div>`:''}
          ${m.example?`<div style="margin-top:5px; padding:5px 8px; background:#fff; border-radius:6px; font-size:12.5px; line-height:1.5;">
            <span>${escapeHtml(m.example)}</span>
            <button style="border:none; background:transparent; color:var(--blue); font-size:13px; cursor:pointer; padding:0 4px;" onclick="event.stopPropagation();speakWord(\`${(m.example||'').replace(/`/g,'').replace(/\\\\/g,'\\\\\\\\').replace(/\$/g,'').slice(0,140).replace(/'/g,"\\'")}\`)">🔊</button>
            ${m.example_cn?`<div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${escapeHtml(m.example_cn)}</div>`:''}
          </div>`:''}
        </div>`;
      });
    }
    if(dict.common_collocation){
      inner += `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;">🔥 ${escapeHtml(dict.common_collocation)}</div>`;
    }
    if(dict.memory_tip){
      inner += `<div style="font-size:11.5px; color:var(--orange); margin-top:4px; line-height:1.5;">💡 ${escapeHtml(dict.memory_tip)}</div>`;
    }
  } else if(w.meaning && w.meaning !== '点详情查词...'){
    inner += `<div style="margin-top:6px; padding:8px 10px; background:#F1EFEB; border-radius:8px; font-size:12.5px; color:var(--ink-soft);">${escapeHtml(w.meaning)}</div>`;
  } else {
    inner += `<div style="margin-top:6px; padding:8px 10px; background:#F1EFEB; border-radius:8px; font-size:12.5px; color:var(--ink-soft);">点详情查词...</div>`;
  }
  return `<div style="background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="flex:1; min-width:0;">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <div style="font-size:22px; font-weight:700; color:var(--ink);">${escapeHtml(w.phrase)}</div>
          <span style="font-size:10px; padding:1px 6px; border-radius:4px; background:${w.type==='phrase'?'rgba(109,76,255,0.15)':'rgba(62,140,255,0.15)'}; color:${w.type==='phrase'?'var(--violet)':'var(--blue)'}; flex-shrink:0;">${w.type==='phrase'?'词伙':'单词'}</span>
          ${dict?'':`<button style="border:none; background:var(--violet); color:#fff; font-size:11px; padding:3px 10px; border-radius:12px; cursor:pointer;" onclick="event.stopPropagation();reFetchMeaning('${w.id}')">查释义</button>`}
        </div>

      <button style="border:none; background:transparent; font-size:24px; color:var(--blue); cursor:pointer; padding:4px 8px; flex-shrink:0;" onclick="event.stopPropagation();speakWord('${safePhrase}')" title="朗读">🔊</button>
    </div>
    <div style="margin-top:4px;">${inner}</div>
  </div>`;
}

async function fetchMeaningForEntry(w){
  if(!aiReady()){ w.meaning = '请先在 AI 设置中填 API Key。'; return; }
  try{
    const prompt = `你是英汉词典 + 例句生成器。请查询英文词组/单词 "${w.phrase}" 的详细信息。

只输出一个 JSON 对象，不要任何其他文字或 markdown：
{
  "phonetic_uk": "英式音标",

function exportWordbook(){
  if(WORD_BOOK.length===0){ alert('词库是空的'); return; }
  const text = WORD_BOOK.map(w=>{
    const d = new Date(w.ts);
    const date = d.toISOString().slice(0,10);
    return `[${date}] [${w.type}] ${w.phrase}\n  释义：${w.meaning||'（未查）'}\n  来源：${w.source}${w.sourceRefs?` (${w.sourceRefs.length} 处)`:''}\n`;
  }).join('\n');
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wordbook.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}

function parseAndImportNoteText(text){
  loadWordBook();
  let added = 0;
  let existing = 0;
  const newEntries = [];
  const now = Date.now();
  const lines = text.split(/\n/);
  const groups = [];
  let cur = [];
  lines.forEach(line=>{
    if(line.trim()){
      cur.push(line);
    } else {
      if(cur.length) groups.push(cur);
      cur = [];
    }
  });
  if(cur.length) groups.push(cur);
  groups.forEach((group, gIdx)=>{
    group.forEach(line=>{
      const candidates = [];
      line.split('/').forEach(part=>{
        const m = part.match(/^\s*([a-zA-Z][a-zA-Z\s,'-]*[a-zA-Z])\s*[\(（:：]?/);
        if(m && m[1]){
          candidates.push(m[1].trim());
        } else {
          const m2 = part.match(/^\s*([a-zA-Z][a-zA-Z\s,'-]*)/);
          if(m2 && m2[1] && m2[1].trim().length>=2) candidates.push(m2[1].trim());
        }
      });
      const firstEn = line.match(/^\s*([a-zA-Z][a-zA-Z\s,'-]+[a-zA-Z])/);
      if(firstEn) candidates.push(firstEn[1].trim());
      candidates.forEach(c=>{
        const phrase = c.trim();
        if(!phrase || phrase.length<2) return;
        if(!/[a-zA-Z]/.test(phrase)) return;
        const key = normalizePhrase(phrase);
        if(!key) return;
        const wordCount = phrase.split(/\s+/).filter(w=>/^[a-zA-Z]/.test(w)).length;
        const type = wordCount >= 2 ? 'phrase' : 'word';
        if(WORD_INDEX[key]){
          const ex = WORD_BOOK.find(w=>w.id === WORD_INDEX[key]);
          if(ex){
            attachSourceToEntry(ex, {type:'note', id:'g'+gIdx, snippet: line.slice(0,80)});
            ex.source = 'note';
            existing++;
          }
          return;
        }
        const entry = addWordBookEntry(phrase, {
          type, source: 'note', ts: now,
          sourceRefs: [{type:'note', id:'g'+gIdx, snippet: line.slice(0,80)}],
          note: line
        });
        if(entry){
          entry._noteContext = group.join(' | ').slice(0,200);
          newEntries.push(entry);
          added++;
        }
      });
    });
  });
  saveWordBook();
  return {added, existing, newEntries};
}

function ensureVoice(word){
  if(!('speechSynthesis' in window)) return;
  // 先静默朗读一次让 iOS 加载语音
  try{
    const u = new SpeechSynthesisUtterance(word);
    u.volume = 0;
    speechSynthesis.speak(u);
  }catch(e){}
}

function speakWord(word){
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    alert('当前浏览器不支持语音功能，建议使用 iOS Safari 或 Chrome。');
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.9;
    u.pitch = 1;
    // 尝试用 iOS 高级 Siri 语音（如果系统装了）
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v => v.name.includes('Samantha')) ||
                     voices.find(v => v.name.includes('Karen')) ||
                     voices.find(v => v.name.includes('Daniel')) ||
                     voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) ||
                     voices.find(v => v.lang.startsWith('en-US') && v.localService) ||
                     voices.find(v => v.lang.startsWith('en')) ||
                     voices[0];
    if(preferred){
      u.voice = preferred;
    }
    speechSynthesis.speak(u);
  }catch(e){
    alert('语音播放失败：'+(e.message||e));
  }
}

        <button class="btn btn-ghost" onclick="closeErrorSummary()">关闭</button>
      </div>
    </div>
  </div>`;
  const div = document.createElement('div');
  div.innerHTML = html;
  div.id = 'error-summary-modal';
  document.body.appendChild(div);
}

function closeErrorSummary(){
  const m = document.getElementById('error-summary-modal');
  if(m) m.remove();
}

function renderErrorSummaryLocal(){
  const allErrors = collectAllErrors();
  if(allErrors.length === 0){
    return '<div class="empty" style="padding:30px 20px;">还没有批改记录，先去练几道题再来汇总。</div>';
  }
  // 本地按 type 聚合
  const groups = {};
  allErrors.forEach(e=>{
    const t = e.type || '其他';
    if(!groups[t]) groups[t] = [];
    groups[t].push(e);
  });
  let html = '<div style="margin-bottom:10px; font-size:12px; color:var(--ink-soft);">📊 共 ${allErrors.length} 条错误记录，按类型分组：</div>';
  // 按出现次数排序
  const sortedTypes = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  sortedTypes.forEach(([type, list])=>{
    html += `<div style="margin-bottom:10px; padding:10px 12px; background:var(--card); border-radius:10px; box-shadow:var(--shadow);">
      <div style="font-size:14px; font-weight:700; color:var(--violet); margin-bottom:6px;">${escapeHtml(type)}（${list.length} 次）</div>
      <div style="font-size:12.5px; color:var(--ink-soft); line-height:1.6;">`;
    list.slice(0,3).forEach(e=>{
      html += `<div style="margin-bottom:4px; padding-left:8px; border-left:2px solid var(--paper-line);">第 ${e.sid} 句：<span style="text-decoration:line-through; color:var(--red);">${escapeHtml(e.original)}</span> → <span style="color:var(--green);">${escapeHtml(e.fixed)}</span></div>`;
    });
    if(list.length > 3) html += `<div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">...还有 ${list.length-3} 条类似错误</div>`;
    html += '</div></div>';
  });
  return html;
}

function collectAllErrors(){
  const errors = [];
  Object.entries(PROGRESS).forEach(([sid, p])=>{
    if(!p.result) return;
    // 新格式：key_fix（单一关键错误）
    if(p.result.key_fix && p.result.key_fix.original){
      errors.push({
        sid: sid,
        type: p.result.key_fix.type || '其他',
        original: p.result.key_fix.original || '',
        fixed: p.result.key_fix.fixed_75 || '',
        explanation: p.result.key_fix.explanation || ''
      });
    }
    // 兼容旧格式：corrections（多个错误）
    if(p.result.corrections && p.result.corrections.length){
      p.result.corrections.forEach(c=>{
        errors.push({
          sid: sid,
          type: c.type || '其他',
          original: c.original || '',
          fixed: c.fixed || '',
          explanation: c.explanation || ''
        });
      });
    }
  });
  return errors;
}

async function aiErrorSummary(){
  if(!aiReady()){
    alert('请先在 AI 设置里填 API Key。');
    return;
  }
  const errors = collectAllErrors();
  if(errors.length === 0){
    alert('还没有批改记录。');
    return;
  }
  const bodyEl = document.getElementById('errorSummaryBody');
  bodyEl.innerHTML = '<div class="feedback-box info" style="margin:0;"><span class="spinner"></span>AI 正在分析你的所有错题...</div>';
  const summary = errors.map(e=>`第${e.sid}句 [${e.type}]: "${e.original}" → "${e.fixed}" (${e.explanation})`).join('\n');
  const errorTypeBreakdown = {};
  errors.forEach(e=>{
    errorTypeBreakdown[e.type] = (errorTypeBreakdown[e.type] || 0) + 1;
  });
  const typeSummary = Object.entries(errorTypeBreakdown).map(([t,c])=>`${t}: ${c}次`).join(', ');
  const prompt = `你是一位专业的雅思写作老师，帮我把以下错题做个深度汇总。

【学生所有错题】
${summary}

【任务】
1. 按错误类型聚类（搭配/语法/用词/句式等）
2. 找出学生**最容易犯的 3-5 个共性问题**
3. 每个问题给出**知识点讲解**（为什么这么用是错的，正确用法是什么）
4. 给出**怎么记**的具体方法（举例说明）
5. 给出**3-5 个练习建议**

请只输出一个 JSON 对象：
{
  "total": 数字,
  "by_type": { "类型1": 数字, "类型2": 数字 },
  "patterns": [
    { "name": "问题名称", "count": 涉及几道题, "knowledge": "知识点讲解", "memory_tip": "怎么记", "examples": ["正确例子 1", "正确例子 2"] }
  ],
  "practice_plan": ["具体练习建议 1", "练习建议 2"]
}`;
  try{
    const result = await callAI(prompt);
    bodyEl.innerHTML = renderAISummary(result);
  }catch(e){
    let msg = 'AI 分析失败：'+(e.message||e);
    if(e.message && e.message.startsWith('JSON_PARSE_FAIL')){
      msg = 'AI 返回格式异常，请重试。';
    }
    bodyEl.innerHTML = `<div class="feedback-box warn" style="margin:0;">${escapeHtml(msg)}</div>`;
  }
}

function renderAISummary(r){
  let html = '';
  if(r.patterns && r.patterns.length){
    html += '<div style="font-size:14px; font-weight:700; color:var(--violet); margin-bottom:10px;">🎯 你的共性问题（按严重程度排序）</div>';
    r.patterns.forEach((p,i)=>{
      html += `<div style="background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); border-left:4px solid var(--violet);">
        <div style="font-size:15px; font-weight:700; margin-bottom:4px;">${i+1}. ${escapeHtml(p.name||'')} <span style="font-size:11px; color:var(--ink-soft); font-weight:normal;">（${p.count||0} 道题）</span></div>
        <div style="font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:8px;">${escapeHtml(p.knowledge||'')}</div>
        ${p.memory_tip?`<div style="background:rgba(109,76,255,0.08); padding:8px 10px; border-radius:8px; font-size:12.5px; margin-bottom:6px;"><b style="color:var(--violet);">💡 怎么记：</b>${escapeHtml(p.memory_tip)}</div>`:''}
        ${p.examples && p.examples.length?`<div style="font-size:12.5px; color:var(--green); line-height:1.6;">
          ${p.examples.map(ex=>`✓ ${escapeHtml(ex)}`).join('<br>')}
        </div>`:''}
      </div>`;
    });
  }
  if(r.practice_plan && r.practice_plan.length){
    html += '<div style="font-size:14px; font-weight:700; color:var(--orange); margin:14px 0 10px;">📅 练习建议</div>';
    html += '<div style="background:rgba(245,158,11,0.10); padding:12px 14px; border-radius:12px; font-size:13.5px; line-height:1.8;">';
    r.practice_plan.forEach((p,i)=>{
      html += `<div>${i+1}. ${escapeHtml(p)}</div>`;
    });
    html += '</div>';
  }
  return html;
}

</script>
</body>
</html>
